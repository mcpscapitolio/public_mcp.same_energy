name: same-energy-public-mcp
services:
  same-energy:
    build: .
    image: same-energy-public-mcp:local
    init: true
    restart: unless-stopped
    shm_size: 1gb
    command: [same-energy-catalog]
    ports:
      - "127.0.0.1:${SAME_ENERGY_CATALOG_PORT:-8765}:8765"
    environment:
      SAME_ENERGY_WORKSPACE: /workspace
      SAME_ENERGY_HOST_WORKSPACE: ${SAME_ENERGY_WORKSPACE_DIR:?Preencha SAME_ENERGY_WORKSPACE_DIR no .env}
      SAME_ENERGY_PREFERENCES_FILE: /data/preferences.json
      SAME_ENERGY_INSTALL_DIRECTORY: ${SAME_ENERGY_INSTALL_DIRECTORY:-}
      SAME_ENERGY_CATALOG_PORT: ${SAME_ENERGY_CATALOG_PORT:-8765}
    volumes:
      - type: bind
        source: ${SAME_ENERGY_WORKSPACE_DIR:?Preencha SAME_ENERGY_WORKSPACE_DIR no .env}
        target: /workspace
      - same-energy-data:/data
    healthcheck:
      test: [CMD, python, -c, "from same_energy_mcp.catalog import healthcheck; healthcheck()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
volumes:
  same-energy-data:
